services:
  pandan:
    build: .
    # Only on this machine. Change to "3000:3000" to reach it from your network,
    # but read the security note in the README first.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Put APP_PASSWORD in a .env file next to this one. `npm run setup` makes it.
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env first}
      DB_PATH: /data/pandan.db
      NODE_ENV: production
    volumes:
      - pandan-data:/data
    restart: unless-stopped

volumes:
  pandan-data:
